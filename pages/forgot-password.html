<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Thoughtful swimming programs, patient coaching and purposeful progress for kids and adults."
        />
        <meta name="theme-color" content="#542447" />
        <title>Reset your password | Orynwave Swim Academy</title>
        <link rel="canonical" href="https://teknritsolutions.github.io/Swimming-Academy-for-Kids-Adults/pages/forgot-password.html" />
        <meta property="og:title" content="Reset your password | Orynwave Swim Academy" />
        <meta
            property="og:description"
            content="Thoughtful swimming programs, patient coaching and purposeful progress for kids and adults."
        />
        <meta property="og:type" content="website" />
        <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
        <link rel="icon" href="../assets/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
        <script src="../assets/js/theme.js"></script>
        <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css" />
        <link rel="stylesheet" href="../assets/css/variables.css" />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/components.css" />
        <link rel="stylesheet" href="../assets/css/dark-mode.css" />
        <link rel="stylesheet" href="../assets/css/rtl.css" />
        <link rel="stylesheet" href="../assets/css/responsive.css" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebPage",
                "name": "Reset your password",
                "description": "Thoughtful swimming programs, patient coaching and purposeful progress for kids and adults."
            }
        </script>
    </head>
    <body class="auth-body auth-premium auth-forgot">
        <main id="main" class="auth-layout"><div class="auth-photo">
                <a class="brand" href="homepage1.html">
                    <img src="../assets/favicon.svg" alt="" />
                    <div>
                        <strong>
                            orynwave
                            <span>Swimming academy</span>
                        </strong>
                    </div>
                </a>
                <img
                    src="../assets/images/login-photo.webp"
                    alt="A tranquil indoor swimming pool"
                    class=""
                    width="1200"
                    height="800"
                    srcset="../assets/images/login-photo-640.webp 640w, ../assets/images/login-photo.webp 1200w"
                    sizes="(max-width:767px) calc(100vw - 32px), (max-width:1023px) 48vw, 560px"
                    fetchpriority="high"
                    decoding="async"
                />
                <div class="auth-caption">
                    <span class="eyebrow">A lifelong love of the water</span>
                    <h2>A fresh start. Back to your next chapter.</h2>
                    <p>A little help getting back to your swimming journey.</p>
                </div>
            </div>
            <div class="auth-main"><div class="auth-tools">
                <button
                    class="icon-btn theme-toggle"
                    aria-label="Switch color theme"
                    title="Switch theme"
                >
                    <i data-lucide="moon" aria-hidden="true"></i>
                </button>
                <button
                    class="icon-btn rtl-toggle"
                    aria-label="Switch text direction"
                    title="Switch text direction"
                >
                    <span dir="ltr">RTL</span>
                </button>
            </div><div class="auth-card">
                <span class="eyebrow">Account recovery</span>
                <h1>A fresh start.</h1>
                <p>
                    Enter your email to review a password-reset request. Email delivery is not
                    connected.
                </p>
                <form
                    class="demo-form"
                    data-message="Reset request validated. No email was sent; secure account recovery is not connected."
                >
                    <div class="field">
                        <label for="reset-email">Email address</label>
                        <input
                            autocomplete="email" id="reset-email"
                            name="reset-email"
                            type="email"
                            placeholder="Enter your email address"
                            required
                        />
                    </div>
                    <button class="btn">
                        Send Reset Link
                        <i data-lucide="arrow-right" aria-hidden="true"></i>
                    </button>
                    <p class="form-feedback" role="status" aria-live="polite"></p>
                </form>
                <p class="auth-note"><a class="" href="login.html">Back to Login</a></p></div></div></main>
        <dialog id="app-dialog">
            <div class="dialog-head">
                <h2 id="dialog-title">Details</h2>
                <button class="icon-btn" id="dialog-close" aria-label="Close dialog">
                    <i data-lucide="x" aria-hidden="true"></i>
                </button>
            </div>
            <div id="dialog-content"></div>
        </dialog>
        <div class="toast" id="toast" role="status" hidden></div>
        <script src="../assets/vendor/lucide.min.js"></script>
        <script src="../assets/js/main.js" defer></script>
        <script src="../assets/js/rtl.js" defer></script>
        <script src="../assets/js/forms.js" defer></script>
        <script src="../assets/js/filters.js" defer></script>
        <script src="../assets/js/selects.js" defer></script>
    </body>
</html>
